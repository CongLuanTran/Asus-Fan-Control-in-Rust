[package]
name = "fanctl"
version = "0.1.2"
edition = "2024"

[dependencies]
clap = { version = "4.6.0", features = ["derive"] }
dirs = "7.0.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
strum = { version = "0.28", features = ["derive"] }
sysinfo = "0.39.1"
tokio = { version = "1.50.0", features = ["full", "net", "rt", "sync"] }
toml = "1.1.2"
tracing = "0.1.44"
tracing-journald = "0.3.2"
tracing-subscriber = "0.3.23"
walkdir = "2.5.0"

[profile.release]
opt-level = 3
strip = true
lto = true
panic = "abort"
codegen-units = 1
